[project]
name = "payments-platform-capstone"
version = "0.1.0"
description = "All of it, running, measured and packaged"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "DTZ", "RUF"]
