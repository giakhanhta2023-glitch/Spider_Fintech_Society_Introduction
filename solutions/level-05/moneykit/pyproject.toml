[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moneykit"
version = "0.1.0"
description = "Exact money arithmetic, with the rounding rule always visible"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moneykit"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--cov=moneykit --cov-report=term-missing --cov-fail-under=95 --doctest-modules"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N818 wants every exception to end in Error. These names are the public API
# of the library and are referenced by the brief, so the rule loses here.
ignore = ["N818"]

[tool.coverage.run]
branch = true
source = ["moneykit"]
