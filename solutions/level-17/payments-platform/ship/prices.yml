# Unit prices for the cost model.
#
# **Every price in this file is marked `verified: false`, and that is not a
# placeholder to be ignored.** The machine this solution was written on has no
# cloud account, so nothing here was read off an invoice or a pricing API. The
# values are the order of magnitude published for us-east-1 at the time of
# writing, and they are inputs to the model rather than findings of it.
#
# Fill them in properly before quoting any total to anybody:
#
#   aws pricing get-products --service-code AmazonEC2 --region us-east-1 \
#     --filters 'Type=TERM_MATCH,Field=instanceType,Value=m7g.large'
#   aws ce get-cost-and-usage --time-period Start=2026-08-01,End=2026-09-01 \
#     --granularity MONTHLY --metrics UnblendedCost --group-by Type=DIMENSION,Key=SERVICE
#
# The second command is the better one: it prices your account rather than the
# list, including the discounts, the free tiers and the things nobody remembers
# switching on. A cost model built from list prices is a starting point, and the
# bill is the measurement.
#
# `sensitivity` marks the lines worth arguing about. The model prints those
# separately, because a total is less useful than knowing which two numbers move
# it.

region: us-east-1
currency: USD
checked: "2026-09-24"
verified: false

prices:
  fargate_vcpu_hour:
    value: 0.04048
    unit: per vCPU hour
    source: https://aws.amazon.com/fargate/pricing/
    verified: false
    sensitivity: high

