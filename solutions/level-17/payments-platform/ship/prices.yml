# The fee the business pays to accept a card, which is the number the
# infrastructure total should be compared against. Roughly 2.9% plus 30 cents is
# the published small business rate for several processors; a company doing 130
# million payments a month is not paying list either, and would say so.
processing_fee:
  percent: 2.9
  fixed_cents: 30
  verified: false
  note: >-
    Published small business card rate, order of magnitude. Negotiated rates at
    this volume are materially lower and are under a contract nobody publishes.
