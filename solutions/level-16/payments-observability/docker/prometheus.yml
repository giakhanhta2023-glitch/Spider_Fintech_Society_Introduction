# Scrape configuration. Not exercised on the machine this was written on: see
# the header of compose.yml.
#
# The scrape interval is the number to read twice. Fifteen seconds is the usual
# choice, and it is also the deadline every scrape has to meet. Experiment 1
# measured a scrape of 200,000 series taking 15.7 seconds, which is 105% of the
# interval: Prometheus then falls behind, the gaps appear in the graphs during
# the incident that made the series appear, and the monitoring is the outage.

global:
  scrape_interval: 15s
  scrape_timeout: 10s          # shorter than the interval, on purpose
  evaluation_interval: 30s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: payments-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: payments-api

  # A second target with the same job on purpose, so the cross instance
  # percentile aggregation in burn_rate.yml has more than one instance to
  # aggregate. Summing buckets across instances is only interesting when there
  # are instances, and one deliberately slow one is how the max panel earns its
  # place.
  - job_name: payments-api-slow-instance
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: payments-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
